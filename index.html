<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#010101">
    <meta name="description" content="Western World Political Dashboard - Interactive map showing global governance data for 2025">
    <title>Western World Political Dashboard 2025</title>

    <!-- Preconnect for faster loading -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Critical CSS inline, defer non-critical -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- 1. GLOBAL SETTINGS & PERFORMANCE --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            margin: 0;
            background-color: #010101;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        #map {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100%;
            z-index: 1;
            background: #010101;
            outline: none;
            will-change: transform;
        }

        path.leaflet-interactive:focus { outline: none; }

        /* --- 2. GLASSMORPHISM UI --- */
        .glass-header {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 1000;
            width: 360px;
            max-width: calc(100% - 48px);
            padding: 24px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .glass-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(120deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .glass-header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            color: #888;
            font-weight: 400;
        }

        /* Sidebar - Desktop */
        .info-sidebar {
            position: absolute;
            top: 24px;
            right: -550px;
            bottom: 24px;
            width: 420px;
            z-index: 1001;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px 0 0 30px;
            padding: 32px;
            color: white;
            transition: right 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -40px 0 80px rgba(0,0,0,0.9);
            overflow-y: auto;
            overscroll-behavior: contain;
            transform: translateZ(0);
            will-change: right, transform;
        }

        .info-sidebar.active { right: 0; }

        /* --- 3. COLORS & BADGES --- */
        /* USER REQUEST: Prog=Blue, Cons=Red, Cent=Green */
        
        .badge-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .state-badge { 
            display: inline-flex; align-items: center; 
            padding: 6px 16px; border-radius: 100px; 
            font-size: 10px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        /* Neon Blue (Progressive) */
        .badge-prog { 
            background: rgba(0, 204, 255, 0.15); color: #00ccff; 
            border: 1px solid rgba(0, 204, 255, 0.5); 
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.2); 
        }

        /* Neon Red (Conservative) */
        .badge-cons { 
            background: rgba(255, 51, 51, 0.15); color: #ff3333; 
            border: 1px solid rgba(255, 51, 51, 0.5); 
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.2); 
        }

        /* Neon Green (Centrist) */
        .badge-cent { 
            background: rgba(0, 255, 153, 0.15); color: #00ff99; 
            border: 1px solid rgba(0, 255, 153, 0.5); 
            box-shadow: 0 0 20px rgba(0, 255, 153, 0.2); 
        }
        
        .badge-inst { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }

        /* Sidebar Styles */
        .sidebar-title { 
            font-size: 40px; font-weight: 900; margin: 0 0 25px 0; 
            line-height: 1; letter-spacing: -1.5px;
            display: flex; align-items: center; gap: 15px;
        }
        .flag-icon { font-size: 32px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); }

        .data-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; margin-bottom: 30px; }
        .data-item { background: rgba(255,255,255,0.02); padding: 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .data-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 8px; font-weight: 700; }
        .data-value { font-size: 15px; font-weight: 700; color: #eee; line-height: 1.3; }

        .desc-box {
            font-size: 13px; line-height: 1.7; color: #999; 
            padding: 22px; background: rgba(255,255,255,0.02); 
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px; font-weight: 500;
        }

        /* Seat Chart */
        .seat-chart-wrapper { margin-top: 15px; }
        .seat-bar {
            height: 14px; width: 100%; background: rgba(255,255,255,0.05);
            border-radius: 100px; overflow: hidden; display: flex;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .seat-segment { height: 100%; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); position: relative; }
        .seat-segment::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: inherit; filter: blur(10px); opacity: 0.7; }

        .seat-legend { display: flex; justify-content: space-between; font-size: 10px; font-family: 'Inter', monospace; color: #777; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        .sl-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }

        /* Tooltip */
        .leaflet-tooltip.glass-tooltip {
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before, 
        .leaflet-tooltip-left:before, .leaflet-tooltip-right:before { display: none; }

        /* Close button for sidebar */
        .sidebar-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 10;
        }
        
        .sidebar-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Drag handle for mobile bottom panel */
        .drag-handle {
            display: none;
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        /* --- MOBILE STYLES --- */
        /* For devices with 16:9 ratio (standard phones) and 20:9 ratio (modern tall phones) */
        @media screen and (max-width: 768px) {
            .glass-header {
                top: 16px;
                left: 16px;
                width: auto;
                max-width: calc(100% - 32px);
                padding: 16px 20px;
                border-radius: 16px;
            }
            
            .glass-header h1 {
                font-size: 18px;
                letter-spacing: -0.5px;
            }
            
            .glass-header p {
                font-size: 11px;
                margin-top: 4px;
            }
            
            /* Mobile Bottom Panel */
            .info-sidebar {
                top: auto;
                right: 0;
                left: 0;
                bottom: 0;
                width: 100%;
                height: auto;
                max-height: 40vh; /* 30-40% of screen */
                min-height: 35vh;
                border-radius: 24px 24px 0 0;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding: 12px 20px 24px;
                transform: translateY(100%);
                transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
                box-shadow: 0 -20px 60px rgba(0,0,0,0.8);
            }
            
            .info-sidebar.active {
                right: 0;
                transform: translateY(0);
            }
            
            .drag-handle {
                display: block;
            }
            
            .sidebar-close {
                top: 8px;
                right: 12px;
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
            
            .sidebar-title {
                font-size: 24px !important;
                margin-bottom: 12px !important;
            }
            
            .flag-icon {
                font-size: 22px !important;
            }
            
            .badge-container {
                margin-bottom: 12px !important;
            }
            
            .state-badge {
                padding: 4px 12px !important;
                font-size: 9px !important;
            }
            
            .data-grid {
                gap: 10px !important;
                margin-bottom: 16px !important;
            }
            
            .data-item {
                padding: 12px !important;
                border-radius: 12px !important;
            }
            
            .data-label {
                font-size: 8px !important;
                margin-bottom: 4px !important;
            }
            
            .data-value {
                font-size: 13px !important;
            }
            
            .desc-box {
                font-size: 12px !important;
                padding: 14px !important;
                margin-bottom: 16px !important;
                border-radius: 12px !important;
                line-height: 1.5 !important;
            }
            
            .seat-chart-wrapper {
                margin-top: 8px !important;
            }
            
            .seat-bar {
                height: 10px !important;
                margin-bottom: 8px !important;
            }
            
            .seat-legend {
                font-size: 9px !important;
            }
            
            /* Optimize tooltip for mobile */
            .leaflet-tooltip.glass-tooltip {
                font-size: 10px;
                padding: 6px 12px;
            }
        }
        
        /* Extra tall phones (20:9 ratio - e.g., iPhone 14 Pro, Samsung Galaxy S23) */
        @media screen and (max-width: 430px) and (min-height: 800px) {
            .info-sidebar {
                max-height: 38vh;
                min-height: 32vh;
            }
        }
        
        /* Shorter phones (16:9 ratio) */
        @media screen and (max-width: 430px) and (max-height: 750px) {
            .info-sidebar {
                max-height: 42vh;
                min-height: 35vh;
            }
            
            .glass-header h1 {
                font-size: 16px;
            }
            
            .sidebar-title {
                font-size: 20px !important;
            }
        }
        
        /* Very small screens */
        @media screen and (max-width: 360px) {
            .glass-header {
                padding: 12px 16px;
            }
            
            .glass-header h1 {
                font-size: 14px;
            }
            
            .glass-header p {
                font-size: 10px;
            }
            
            .info-sidebar {
                padding: 10px 16px 20px;
            }
            
            .sidebar-title {
                font-size: 18px !important;
            }
        }
        
        /* Landscape mode on mobile */
        @media screen and (max-width: 896px) and (orientation: landscape) {
            .glass-header {
                top: 12px;
                left: 12px;
                padding: 12px 16px;
            }
            
            .glass-header h1 {
                font-size: 16px;
            }
            
            .glass-header p {
                font-size: 10px;
            }
            
            .info-sidebar {
                max-height: 60vh;
                min-height: 50vh;
            }
        }
        
        /* Tablet styles */
        @media screen and (min-width: 769px) and (max-width: 1024px) {
            .info-sidebar {
                width: 380px;
                padding: 24px;
            }
            
            .glass-header {
                width: 320px;
            }
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            .info-sidebar,
            .seat-segment,
            .sidebar-close {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

    </style>
</head>
<body>

    <div class="glass-header">
        <h1>Global West Governance</h1>
        <p>Political Landscape (Nov 2025 Edition)</p>
    </div>

    <div id="sidebar" class="info-sidebar">
        <div class="drag-handle"></div>
        <button type="button" class="sidebar-close" onclick="closeSidebar()" aria-label="Close panel">×</button>
        <div id="sidebar-content"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- 1. PERFORMANCE & UTILITY FUNCTIONS ---
        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        const sidebar = document.getElementById('sidebar');
        
        function closeSidebar() {
            sidebar.classList.remove('active');
            if (!isMobile) {
                map.flyTo([30, -10], 2, { duration: 0.8 });
            }
        }
        
        // Debounce function for performance
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        // --- 2. INITIALIZE MAP ---
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            center: [30, -10],
            zoom: isMobile ? 1.5 : 2,
            minZoom: isMobile ? 1 : 2,
            maxBounds: [[-85, -180], [85, 180]],
            tap: true,
            touchZoom: true,
            dragging: true,
            preferCanvas: true // Better performance for mobile
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // --- 3. DATABASE: NOV 2025 REALITY ---
        // Data last updated: November 2025
        // Knowledge cutoff: November 2025 elections and government changes
        // P=Progressive(Blue), C=Conservative(Red), L=Centrist(Green)
        
        const db = {
            // --- North America ---
            "USA": { 
                code:"C", flag:"🇺🇸", leader:"Donald Trump", party:"Republican", 
                gov:"Executive Pres.", seats:{g:220, t:435}, 
                desc:"Donald Trump returns to the presidency (2025-2029). Republicans hold a slim majority in the House." 
            },
            "Canada": { 
                code:"P", flag:"🇨🇦", leader:"Mark Carney", party:"Liberal", 
                gov:"Minority Gov", seats:{g:160, t:338}, 
                desc:"Mark Carney leads a revitalized Liberal minority government, focusing on green energy and budget reform." 
            },
            
            // --- Europe ---
            "United Kingdom": { 
                code:"P", flag:"🇬🇧", leader:"Keir Starmer", party:"Labour", 
                gov:"Majority", seats:{g:412, t:650}, 
                desc:"Labour maintains a strong majority, implementing major climate and infrastructure reforms." 
            },
            "Germany": { 
                code:"C", flag:"🇩🇪", leader:"Friedrich Merz", party:"CDU / CSU", 
                gov:"Grand Coalition", seats:{g:320, t:630}, 
                desc:"Friedrich Merz (CDU) elected Chancellor, forming a Grand Coalition to address economic stagnation." 
            },
            "France": { 
                code:"L", flag:"🇫🇷", leader:"Michel Barnier (PM)", party:"Ensemble / LR", 
                gov:"Minority Coalition", seats:{g:212, t:577}, 
                desc:"Michel Barnier leads a fragile centrist government navigating a divided National Assembly." 
            },
            "Italy": { 
                code:"C", flag:"🇮🇹", leader:"Giorgia Meloni", party:"Brothers of Italy", 
                gov:"Right Coalition", seats:{g:237, t:400}, 
                desc:"Meloni's right-wing coalition remains stable, focusing on immigration and EU reform." 
            },
            "Spain": { 
                code:"P", flag:"🇪🇸", leader:"Pedro Sánchez", party:"PSOE", 
                gov:"Minority Coalition", seats:{g:152, t:350}, 
                desc:"Sánchez leads a progressive minority government supported by regional partners." 
            },
            "Poland": { 
                code:"L", flag:"🇵🇱", leader:"Donald Tusk", party:"Civic Coalition", 
                gov:"Broad Coalition", seats:{g:248, t:460}, 
                desc:"Centrist coalition continues its pro-EU reforms and judicial restoration." 
            },
            "Netherlands": { 
                code:"C", flag:"🇳🇱", leader:"Dick Schoof", party:"PVV / VVD", 
                gov:"Right Coalition", seats:{g:88, t:150}, 
                desc:"Right-wing coalition government prioritizing strict migration policies." 
            },
            "Sweden": { 
                code:"C", flag:"🇸🇪", leader:"Ulf Kristersson", party:"Moderates", 
                gov:"Right Bloc", seats:{g:176, t:349}, 
                desc:"Conservative government supported by the Sweden Democrats." 
            },
            "Norway": { 
                code:"P", flag:"🇳🇴", leader:"Jonas Gahr Støre", party:"Labour", 
                gov:"Minority", seats:{g:76, t:169}, 
                desc:"Labour-led minority government re-elected in Sept 2025." 
            },
            "Ireland": { 
                code:"C", flag:"🇮🇪", leader:"Micheál Martin", party:"Fianna Fáil", 
                gov:"Coalition", seats:{g:95, t:174}, 
                desc:"Micheál Martin returns as Taoiseach in Jan 2025, leading a FF/FG coalition." 
            },
            
            // --- Oceania ---
            "Australia": { 
                code:"P", flag:"🇦🇺", leader:"Anthony Albanese", party:"Labor", 
                gov:"Majority", seats:{g:78, t:151}, 
                desc:"Albanese's Labor government focuses on cost-of-living relief and renewable energy." 
            },
            "New Zealand": { 
                code:"C", flag:"🇳🇿", leader:"Christopher Luxon", party:"National", 
                gov:"Coalition", seats:{g:68, t:123}, 
                desc:"National-led coalition pursues tax cuts and public service restructuring." 
            }
        };

        // --- 3. STYLING ENGINE ---
        
        function normalizeName(n) {
            if(n === "United States of America") return "USA";
            if(n === "United Kingdom") return "United Kingdom";
            return n;
        }

        function getColor(code) {
            switch(code) {
                case 'P': return '#00ccff'; // Blue (Progressive)
                case 'C': return '#ff3333'; // Red (Conservative)
                case 'L': return '#00ff99'; // Green (Centrist)
                default: return '#444';
            }
        }

        function style(feature) {
            const name = normalizeName(feature.properties.name);
            const data = db[name];
            const color = data ? getColor(data.code) : 'transparent';
            
            return {
                fillColor: color,
                weight: data ? 2 : 0,
                opacity: 1,
                color: color,
                fillOpacity: data ? 0.15 : 0,
                shadowBlur: 30,
                shadowColor: color
            };
        }

        // --- 4. INTERACTION LOGIC ---
        function highlightFeature(e) {
            var layer = e.target;
            const name = normalizeName(layer.feature.properties.name);
            if(!db[name]) return;

            const color = getColor(db[name].code);
            layer.setStyle({ weight: 4, color: color, fillOpacity: 0.4 });
            layer.bringToFront();
        }

        function resetHighlight(e) {
            geojson.resetStyle(e.target);
        }

        function zoomToFeature(e) {
            var layer = e.target;
            const name = normalizeName(layer.feature.properties.name);
            if(!db[name]) return;

            // Smart Zoom Levels - adjusted for mobile
            let z = isMobile ? 4 : 5;
            if(name === 'USA' || name === 'Canada' || name === 'Australia') z = isMobile ? 2.5 : 3;
            if(name === 'United Kingdom' || name === 'France' || name === 'Germany') z = isMobile ? 4 : 5;

            map.flyToBounds(layer.getBounds(), { 
                padding: isMobile ? [30, 30] : [50, 50], 
                duration: isMobile ? 0.8 : 1.2, 
                maxZoom: z 
            });
            updateSidebar(name);
            sidebar.classList.add('active');
        }

        function onEachFeature(feature, layer) {
            const name = normalizeName(feature.properties.name);
            if (db[name]) {
                layer.on({
                    mouseover: highlightFeature,
                    mouseout: resetHighlight,
                    click: zoomToFeature
                });
                layer.bindTooltip(name, {
                    permanent: false,
                    direction: "center",
                    className: "glass-tooltip"
                });
            }
        }

        // --- 5. SIDEBAR UPDATER ---
        function updateSidebar(name) {
            const data = db[name];
            if (!data) return;
            
            // Badge Logic
            let badgeClass = 'badge-inst';
            let alignText = 'Other';
            if(data.code === 'P') { badgeClass = 'badge-prog'; alignText = 'Progressive'; }
            if(data.code === 'C') { badgeClass = 'badge-cons'; alignText = 'Conservative'; }
            if(data.code === 'L') { badgeClass = 'badge-cent'; alignText = 'Centrist'; }

            const govPerc = (data.seats.g / data.seats.t) * 100;
            const barColor = getColor(data.code);
            const oppSeats = data.seats.t - data.seats.g;

            const html = `
                <div class="badge-container">
                    <span class="state-badge ${badgeClass}">${alignText}</span>
                    <span class="state-badge badge-inst">${data.gov}</span>
                </div>
                
                <h2 class="sidebar-title">
                    <span class="flag-icon">${data.flag}</span> ${name}
                </h2>
                
                <div class="desc-box">${data.desc}</div>

                <div class="data-grid">
                    <div class="data-item">
                        <div class="data-label">Leader</div>
                        <div class="data-value">${data.leader}</div>
                        <div style="font-size:11px; color:${barColor}; margin-top:4px; font-weight:700;">${data.party.toUpperCase()}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Legislature</div>
                        <div class="data-value" style="font-family:'Inter'; font-size:18px;">
                            <span style="color:${barColor}">${data.seats.g}</span> / ${data.seats.t}
                        </div>
                    </div>
                </div>

                <div class="data-section" style="border:none;">
                    <div class="data-label">Power Balance</div>
                    <div class="seat-chart-wrapper">
                        <div class="seat-bar" style="box-shadow: 0 0 10px ${barColor}30;">
                            <div class="seat-segment" style="width: ${govPerc}%; background: ${barColor};"></div>
                            <div class="seat-segment" style="width: ${100-govPerc}%; background: rgba(255,255,255,0.1);"></div>
                        </div>
                        <div class="seat-legend">
                            <div class="sl-item" style="color:${barColor}">
                                <div class="dot" style="background:${barColor}"></div>
                                <span>Gov: ${data.seats.g}</span>
                            </div>
                            <div class="sl-item">
                                <span>Opp: ${oppSeats}</span>
                                <div class="dot" style="background:rgba(255,255,255,0.3)"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('sidebar-content').innerHTML = html;
        }

        map.on('click', function(e) {
             if (e.originalEvent.target.id === 'map' || e.originalEvent.target.classList.contains('leaflet-container')) {
                 closeSidebar();
             }
        });

        // Touch handling for mobile bottom panel swipe-to-close
        if (isMobile) {
            let startY = 0;
            let currentY = 0;
            
            sidebar.addEventListener('touchstart', function(e) {
                startY = e.touches[0].clientY;
            }, { passive: true });
            
            sidebar.addEventListener('touchmove', function(e) {
                currentY = e.touches[0].clientY;
            }, { passive: true });
            
            sidebar.addEventListener('touchend', function(e) {
                const diff = currentY - startY;
                if (diff > 80) { // Swipe down threshold
                    closeSidebar();
                }
            }, { passive: true });
        }

        // Handle resize events
        const handleResize = debounce(function() {
            map.invalidateSize();
        }, 250);
        window.addEventListener('resize', handleResize);

        // --- 6. LOAD DATA ---
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(res => res.json())
            .then(data => {
                const features = data.features.filter(f => db[normalizeName(f.properties.name)]);
                geojson = L.geoJson({type:"FeatureCollection", features:features}, {
                    style: style,
                    onEachFeature: onEachFeature
                }).addTo(map);
            });

    </script>
</body>
</html>
